<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Spinlab">
  <title>Spinlab</title>
  <!-- The mark is the physics the product teaches: a magnetisation vector
       precessing about B0. Vertical axis = B0, ellipse = the precession orbit
       seen in perspective, the tilted arrow = M with its tip on the cone. -->
  <defs>
    <linearGradient id="sl-g" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- B0 -->
  <path d="M16 27.5V4.5" stroke="url(#sl-g)" stroke-width="1.3" stroke-linecap="round" opacity=".38"/>
  <!-- precession orbit -->
  <ellipse cx="16" cy="20" rx="11.2" ry="4.3" stroke="url(#sl-g)" stroke-width="1.8" opacity=".62"/>
  <!-- magnetisation vector -->
  <path d="M16 20 22.8 8.2" stroke="url(#sl-g)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- vector tip, riding the cone -->
  <circle cx="23.2" cy="7.6" r="3.1" fill="url(#sl-g)"/>
  <!-- origin -->
  <circle cx="16" cy="20" r="1.7" fill="url(#sl-g)" opacity=".85"/>
</svg>
